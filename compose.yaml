services:
    laravel.test:
        build:
            context: './vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - pgsql
    pgsql:
        image: 'postgres:18-alpine'
        ports:
            - '54329:5432'
        environment:
            POSTGRES_DB: pm
            POSTGRES_USER: pm
            POSTGRES_PASSWORD: pm
        volumes:
            - 'pm-pgsql:/var/lib/postgresql'
        networks:
            - sail
        restart: unless-stopped
        healthcheck:
            test: [CMD, pg_isready, '-q', '-U', pm]
            retries: 3
            timeout: 5s
networks:
    sail:
        driver: bridge
volumes:
    pm-pgsql:
        driver: local
